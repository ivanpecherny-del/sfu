<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1 и 2 — Вариант 6</title>
    <link rel="stylesheet" href="../Common/normalize.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Задание 1: Подводная лодка</h2>
    <div class="task-container">
        <div class="ocean-scene">
            <div class="sun-ray"></div>
            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>
            <div class="bubble bubble-3"></div>
            
            <div class="submarine">
                <div class="periscope"></div>
                <div class="tower"></div>
                <div class="body"></div>
                <div class="nose"></div>
                <div class="tail"></div>
                <div class="propeller"></div>
                <div class="window w1"></div>
                <div class="window w2"></div>
                <div class="window w3"></div>
            </div>

            <div class="seabed"></div>
            <div class="weed weed-1"></div>
            <div class="weed weed-2"></div>
            <div class="weed weed-3"></div>
        </div>
    </div>

    <h2>Задание 2: Выстрел из пушки по цели</h2>
    <div class="task-container">
        <div class="cannon-scene">
            <div class="sky"></div>
            <div class="ground"></div>
            
            <div class="cannon">
                <div class="wheel w-left"></div>
                <div class="wheel w-right"></div>
                <div class="barrel"></div>
                <div class="cannon-body"></div>
            </div>

            <div class="cannonball"></div>

            <div class="target">
                <div class="target-stand"></div>
                <div class="target-board"></div>
                <div class="target-dot dot-1"></div>
                <div class="target-dot dot-2"></div>
                <div class="target-dot dot-3"></div>
            </div>

            <div class="smoke smoke-1"></div>
            <div class="smoke smoke-2"></div>
            <div class="smoke smoke-3"></div>
        </div>
    </div>

</body>
</html>
