<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 2 — вариант 6</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #000; }

        .container { width: 100%; margin: 0 auto; background: #fff; }
        .row { display: flex; flex-wrap: wrap; width: 100%; }

        /* блок: 15px белой рамки = отступы между блоками, высота ячейки 150px */
        .b { width: 100%; height: 150px; border: 15px solid #fff; }
        .h2 { height: 300px; }

        /* цвета */
        .indianred { background: #cd5c5c; }  .crimson { background: #dc143c; }  .darkred { background: #8b0000; }
        .pink { background: #ffc0cb; }       .hotpink { background: #ff69b4; }  .mediumvioletred { background: #c71585; }
        .greenyellow { background: #adff2f; } .lime { background: #00ff00; }
        .limegreen { background: #32cd32; }  .mediumspringgreen { background: #00fa9a; }
        .seagreen { background: #2e8b57; }   .darkgreen { background: #006400; }
        .yellowgreen { background: #9acd32; } .olive { background: #808000; }
        .lightsalmon { background: #ffa07a; } .orangered { background: #ff4500; }
        .rosybrown { background: #bc8f8f; }  .sandybrown { background: #f4a460; }
        .chocolate { background: #d2691e; }  .saddlebrown { background: #8b4513; }
        .brown { background: #a52a2a; }

        /* ===================== 320px (базовые стили) ===================== */

        /* A */
        .a1 { width: 83.33333%; }
        .a2 { display: none; }
        .a3 { width: 16.66667%; }

        /* B */
        .b1 { height: 300px; }

        /* C */
        .c-left { width: 100%; }
        .c-top { display: flex; flex-wrap: wrap; width: 100%; }
        .lime { height: 300px; }
        .c-stack { display: flex; width: 100%; }
        .c-stack .b { width: 50%; }
        .c-bottom .b { width: 50%; }
        .c-bottom .yellowgreen,
        .c-bottom .olive,
        .greenyellow { display: none; }

        /* D */
        .d1, .d2 { width: 50%; }

        /* E: обёртки "растворяются", порядок блоков задаётся через order */
        .e-mid, .e-pair { display: contents; }
        .rosybrown   { width: 50%;  height: 300px; order: 1; }
        .sandybrown  { width: 50%;  height: 300px; order: 2; }
        .chocolate   { width: 100%; order: 3; }
        .brown       { width: 100%; order: 4; }
        .saddlebrown { width: 100%; height: 300px; order: 5; }

        /* ===================== 768px ===================== */
        @media (min-width: 768px) {
            .container { width: 768px; }

            /* A */
            .a1 { width: 66.66667%; }
            .a2 { display: block; width: 16.66667%; }
            .a3 { width: 16.66667%; }

            /* B */
            .b1 { height: 150px; }
            .b2, .b3 { width: 50%; }

            /* C */
            .c-left { width: 75%; }
            .lime { width: 66.66667%; }
            .c-stack { display: block; width: 33.33333%; }
            .c-stack .b { width: 100%; }
            .c-bottom .b { width: 33.33333%; }
            .c-bottom .yellowgreen { display: block; }
            .greenyellow { display: block; width: 25%; height: 450px; }

            /* D */
            .d1 { width: 25%; }
            .d2 { width: 75%; }

            /* E */
            .e-mid { display: flex; flex-wrap: wrap; width: 50%; }
            .e-pair { display: block; width: 50%; }
            .e-pair .b { width: 100%; }
            .rosybrown, .sandybrown, .chocolate, .brown, .saddlebrown { order: 0; }
            .rosybrown  { width: 25%; height: 300px; }
            .sandybrown { width: 50%; height: 300px; }
            .chocolate  { width: 25%; height: 300px; }
            .brown, .saddlebrown { height: 150px; }
        }

        /* ===================== 1200px ===================== */
        @media (min-width: 1200px) {
            .container { width: 1200px; }

            /* A */
            .a1 { width: 50%; }
            .a2, .a3 { width: 25%; }

            /* B */
            .b2 { width: 33.33333%; }
            .b3 { width: 66.66667%; }

            /* C */
            .lime { width: 75%; }
            .c-stack { width: 25%; }
            .c-bottom .b { width: 25%; }
            .c-bottom .olive { display: block; }

            /* D */
            .d1 { width: 16.66667%; margin-left: 8.33333%; }
            .d2 { width: 50%; margin-left: 16.66667%; }

            /* E */
            .sandybrown { width: 100%; height: 150px; }
            .e-pair { display: flex; width: 100%; }
            .e-pair .b { width: 50%; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- A -->
        <div class="row">
            <div class="b a1 indianred"></div>
            <div class="b a2 crimson"></div>
            <div class="b a3 darkred"></div>
        </div>

        <!-- B -->
        <div class="row">
            <div class="b b1 pink"></div>
            <div class="b b2 hotpink"></div>
            <div class="b b3 mediumvioletred"></div>
        </div>

        <!-- C -->
        <div class="row">
            <div class="row c-left">
                <div class="c-top">
                    <div class="b lime"></div>
                    <div class="c-stack">
                        <div class="b limegreen"></div>
                        <div class="b mediumspringgreen"></div>
                    </div>
                </div>
                <div class="row c-bottom">
                    <div class="b seagreen"></div>
                    <div class="b darkgreen"></div>
                    <div class="b yellowgreen"></div>
                    <div class="b olive"></div>
                </div>
            </div>
            <div class="b greenyellow"></div>
        </div>

        <!-- D -->
        <div class="row">
            <div class="b d1 lightsalmon"></div>
            <div class="b d2 orangered"></div>
        </div>

        <!-- E -->
        <div class="row">
            <div class="b rosybrown"></div>
            <div class="e-mid">
                <div class="b sandybrown"></div>
                <div class="e-pair">
                    <div class="b saddlebrown"></div>
                    <div class="b brown"></div>
                </div>
            </div>
            <div class="b chocolate"></div>
        </div>

    </div>
</body>
</html>
